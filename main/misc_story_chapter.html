<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title></title>
	<link href='/css/mainsite.css' rel='stylesheet'/>
	<link href='/css/miscstories.css' rel='stylesheet'/>
	<link href='/css/miscstoryillustrations.css' rel='stylesheet'/>
	<link href='/css/sidenav.css' rel='stylesheet'/>
	<link href='/css/materialicons.css' rel='stylesheet'/>
	<link href='/css/eventcard.css' rel='stylesheet'/>
	<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
	<script type="text/javascript" src="/scripts/script.js"></script>
	<script type="text/javascript" src="/scripts/sidenav.js"></script>
	<script type="text/javascript" src="/scripts/misc_story_chapter.js"></script>
</head>
<body>
	<div class="innerbody">
		<div class="siteheader"></div>

		<div id="topnav" class="topnav"></div>

		<div id="mySidenav" class="sidenav">
			<div class="closebtn material-icons" onclick="closeNav()">close</div>
			<h1 id="sidenavheader" class="sidenavtitle"></h1>
			<div id="sidenavgrid" class="sidenavitemcollection"></div>
			<hr class="fadedrule">
			<div id="mainnavgrid" class="mainnavcollection"></div>
		</div>
		<div class="sidenavanchor"></div>

		<div id="storyheader" class="storyheader"></div>

		<div class="storyheadernav chapternav"></div>

		<hr class="sectionbreak hidden">

		<div id="authorsnote" class="authorsnote"></div>

		<hr id="authorsnotesectionbreak" class="sectionbreak ">

		<div class="chaptertext">

			<div id="chapterheader"></div>

			<div id="chaptercontent"></div>

		</div>

		<hr id="authorsfootnotesectionbreak" class="sectionbreak ">

		<div id="authorsfootnote" class="authorsfootnote"></div>

		<div class="storyfooter chapternav"></div>

		<!--<div class="commentbox btscommentbox"></div>-->
		<div id="bottomnav" class="bottomnav"></div>
		<div class="sitefooter"></div>
	</div> <!--innerbody-->
</body>
</html>
