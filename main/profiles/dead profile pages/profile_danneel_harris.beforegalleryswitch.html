	<script>
		var path = window.location.pathname;
		var page = path.split("/").pop();
		var nameOnly = page.replace("profile_","").replace(".html","");
		var firstName = nameOnly.split("_")[0];
		var lastName = nameOnly.split("_")[1];
		//The name needs to be proper case to match the JSON data
		var sFighterName = firstName[0].toUpperCase() + firstName.substr(1).toLowerCase() + " " + lastName[0].toUpperCase() + lastName.substr(1).toLowerCase();
		console.log(sFighterName);

		setStaticLabels(sFighterName);
		getFighterData(sFighterName);
		loadBioText(sFighterName);
		loadFighterAwards(sFighterName);
