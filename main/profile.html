<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title></title>
	<link href="/css/mainsite.css" rel="stylesheet">
	<link href="/css/profiles.css" rel="stylesheet">
	<link href="/css/profilegallery.css" rel="stylesheet">
	<link href="/css/sidenav.css" rel="stylesheet"/>
	<link href='/css/materialicons.css' rel='stylesheet'/>
	<script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
	<script type="text/javascript" src="/scripts/script.js"></script>
	<script type="text/javascript" src="/scripts/sidenav.js"></script>
	<script type="text/javascript" src="/scripts/profile.js"></script>
</head>
<body>
	<div class="innerbody profileinnerbody">
		<div class="siteheader"></div>
		
		<div id="topnav" class="topnav"></div>
		
		<div id="mySidenav" class="sidenav sidenavprofiles">
			<div class="closebtn material-icons" onclick="closeNav()">close</div>
			<h1 id="sidenavheader" class="sidenavtitle"></h1>
			<div id="sidenavgrid" class="sidenavitemcollection"></div>
			<hr class="fadedrule">
			<div id="mainnavgrid" class="mainnavcollection"></div>
		</div>
		<div id="sidenavanchor" class="sidenavanchor"></div>

<!--
		<div class="profilenameplate">
			<img id="profilenameplateimage" class="nameplate"/>
		</div>
-->
		<div id="profiletitle" class="profiletitle">
			<div id="picstripframe" class="picstripframe">
				<div id="picstripbackgroundframe" class="picstripbackgroundframe">
					<div class="picstripimageframe">
						<img id="picstripimage1" class="picstripimage">
					</div>
					<div class="picstripimageframe">
						<img id="picstripimage2" class="picstripimage">
					</div>
					<div class="picstripimageframe">
						<img id="picstripimage3" class="picstripimage">
					</div>
					<div class="picstripimageframe">
						<img id="picstripimage4" class="picstripimage">
					</div>
					<div class="picstripimageframe">
						<img id="picstripimage5" class="picstripimage">
					</div>
					<div class="picstripimageframe">
						<img id="picstripimage6" class="picstripimage">
					</div>
				</div>
			</div>
			<div id="profilesignature" class="profilesignature">
				<img id="signatureimage" class="signatureimage">
			</div>
		</div>
		
		<h2 id="statsection" class="sectionheader"></h2>
		<!--<h2 id="statsection" class="sectionheader"></h2>-->
		<div class="profileheader">
			<div class="profilemainimage">
				<img id="profilemainimage" class="mainprofileimage"/>
			</div>
			
			<div class="profilestats section fighterstats">
			
				<div class="statsflexrow managementpositionrow">
					<div class="managementpositioncell">
						<span id="profilemanagementposition" class="managementpositiontext"></span>
					</div>
				</div>
				<div class="statsflexrow labelrow">
					<div class="statsflexcell labelcell">
						<span id="profilenamelabel" class="statlabel bold"></span>
					</div>
					<div id="nicknameslabelcell" class="statsflexcell labelcell">
						<span id="profilenicknameslabel" class="statlabel bold"></span>
					</div>
				</div>
				<div class="statsflexrow valuerow">
					<div class="statsflexcell valuecell">
						<span id="profilefullname" class="statvalue"></span>
					</div>
					<div id="nicknamesvaluecell" class="statsflexcell valuecell">
						<span id="profilenicknames" class="statvalue"></span>
					</div>
				</div>
				<div class="statsflexrow labelrow">
					<div class="statsflexcell labelcell">
						<span id="profilebirthdatelabel" class="statlabel bold"></span>
					</div>
					<div class="statsflexcell labelcell">
						<span id="profileheightlabel" class="statlabel bold"></span>
					</div>
					<div class="statsflexcell labelcell">
						<span id="profileweightlabel" class="statlabel bold"></span>
					</div>
				</div>
				<div class="statsflexrow valuerow">
					<div class="statsflexcell valuecell">
						<span id="profilebirthdate" class="statvalue"></span>
					</div>
					<div class="statsflexcell valuecell">
						<span id="profileheight" class="statvalue"></span>
					</div>
					<div class="statsflexcell valuecell">
						<span id="profileweight" class="statvalue"></span>
					</div>
				</div>
				<div class="statsflexrow labelrow">
					<div class="statsflexcell labelcell">
						<span id="profilefranchiselabel" class="statlabel bold"></span>
					</div>
					<div class="statsflexcell labelcell">
						<span id="profileweightclasslabel" class="statlabel bold"></span>
					</div>
					<div class="statsflexcell labelcell">
						<span id="profilecountrylabel" class="statlabel bold"></span>
					</div>
				</div>
				<div class="statsflexrow valuerow">
					<div class="statsflexcell valuecell">
						<span id="profilefranchise" class="statvalue"></span>
					</div>
					<div class="statsflexcell valuecell">
						<span id="profileweightclass" class="statvalue"></span>
					</div>
					<div class="statsflexcell valuecell">
						<span class="statvalue"><img id="countryicon"/></span>
					</div>
				</div>
				<div class="statsflexrow labelrow">
					<div class="statsflexcell labelcell">
						<span id="profileplayedbylabel" class="statlabel bold"></span>
					</div>
				</div>
				<div class="statsflexrow valuerow">
					<div class="statsflexcell valuecell">
						<span id="profileplayedby" class="statvalue"></span>
					</div>
				</div>
			</div>
		</div>

		<h2 id="biosection" class="sectionheader"></h2>
		<div id="fighterBio" class="profilebio section bio">
		</div>

		<h2 id="awardssection" class="sectionheader"></h2>
		<div id="profileawardslist" class="profileawards section bio"></div>

		<h2 id="gallerysection" class="sectionheader"></span></h2>
		<div id="profilegallerycontainerid" class="profilegallerycontainer">
			<div id="profilegalleryid" class="profilegallery"></div>
		</div>

		<div id="bottomnav" class="bottomnav"></div>
		<div class="sitefooter"></div>
	</div> <!--innerbody-->
</body>
</html>
