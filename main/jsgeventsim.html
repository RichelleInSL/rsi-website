		<div class="siteheader"></div>
		
		<div id="topnav" class="topnav"></div>

		<div id="mySidenav" class="sidenav sidenavroster">
			<div class="closebtn material-icons" onclick="closeNav()">close</div>
			<h1 id="sidenavheader" class="sidenavtitle"></h1>
			<div id="sidenavgrid" class="sidenavitemcollection"></div>
			<hr class="fadedrule">

		</div>
		<div id="sidenavanchor" class="sidenavanchor"></div>

		<!-- <div id="exportbuttoncontainer" title="Export roster to Excel" onclick = "exportData()">

		</div> -->

			<div id="rosterselector">
				<table id="datasourceselectgrid"></table>
				<!-- <label id="datasourceselectlabel">Data source</label>

				</select> -->
			</div>
			<div id="rostertablecontainer" class="table-container"></div>
		</div>
		

		<div id="formulanotes">
			<h5>Formula Notes</h5>
			<p><span class="notelabel">Formula A: </span><span class="notecontent">Total Fights + Streak + Champion Boost</span></p>
			<p><span class="notelabel">Formula B: </span><span class="notecontent">Total Wins + Streak + Champion Boost</span></p>
			<p><span class="notelabel">Formula C: </span><span class="notecontent">(Total Wins x Win Percent) + Streak + Champion Boost</span></p>
			<p><span class="notelabel">Champion Boost: </span><span class="notecontent">Adds a value of 99 to force the champion to the top.</span></p>
		</div>
